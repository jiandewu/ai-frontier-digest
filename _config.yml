# GitHub Pages: README.md becomes the home page, digest/YYYY/*.md the daily pages.
title: AI 前沿导读
description: 每天精选 10 条以内最值得一读的 AI 前沿进展，附中文科普解释。
lang: zh-CN
markdown: kramdown
kramdown:
  input: GFM

exclude:
  - data
  - tests
  - feeds.csv
  - digest/__init__.py
  - digest/__pycache__
  - digest/check_feeds.py
  - digest/fulltext.py
  - digest/http.py
  - digest/sources.py
  - digest/summarize.py
  - digest/update.py
