# GitHub Pages: README.md becomes the home page, digest/YYYY/*.md the daily pages;
# the science digest lives under science/ (index.md, digest/YYYY/*.md), the daily long read
# under longread/ (index.md, YYYY/*.md), podcast introductions under podcast/ (index.md, YYYY/*.md).
title: AI 前沿导读
description: 每天精选 10 条以内最值得一读的 AI 前沿进展，附中文科普解释。
lang: zh-CN
markdown: kramdown
kramdown:
  input: GFM

defaults:
  - scope:
      path: science
    values:
      section: science
  - scope:
      path: longread
    values:
      section: longread
  - scope:
      path: podcast
    values:
      section: podcast

exclude:
  - data
  - science/data
  - science/feeds.csv
  - longread/data
  - longread/feeds.csv
  - podcast/data
  - podcast/feeds.csv
  - tests
  - feeds.csv
  - digest/__init__.py
  - digest/__pycache__
  - digest/check_feeds.py
  - digest/fulltext.py
  - digest/http.py
  - digest/longread.py
  - digest/numbers.py
  - digest/podcast.py
  - digest/profiles.py
  - digest/sources.py
  - digest/summarize.py
  - digest/update.py
