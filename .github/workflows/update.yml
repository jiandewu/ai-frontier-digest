name: Update

on:
  schedule:
    # 每 4 小时一次（每天 6 次），第 41 分钟，避开整点高峰。
    - cron: "41 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Run unit tests
        run: python3 -m unittest discover -s tests

      - name: Collect and summarize new items
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          COMMIT_MESSAGE_FILE: ${{ runner.temp }}/commit-message.txt
        run: python3 -m digest.update

      - name: Commit new items
        env:
          COMMIT_MESSAGE_FILE: ${{ runner.temp }}/commit-message.txt
        run: |
          git config user.name "jiandewu"
          git config user.email "22378716+jiandewu@users.noreply.github.com"
          git add data digest README.md feed.xml
          if git diff --cached --quiet; then
            echo "No new items."
            exit 0
          fi
          git commit --file "$COMMIT_MESSAGE_FILE"
          git pull --rebase origin main
          git push origin HEAD:main
