name: Long Read

on:
  schedule:
    # 每天两次（UTC 11:17、17:17，即美东早上和中午）；当天已有就直接结束，第二次只在第一次失败时补做。
    - cron: "17 11,17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Shared with the digests so they never push at the same time.
  group: update
  cancel-in-progress: false

jobs:
  longread:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Run unit tests
        run: python3 -m unittest discover -s tests

      - name: Pick today's long read
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          COMMIT_MESSAGE_FILE: ${{ runner.temp }}/commit-message.txt
        run: python3 -m digest.longread

      - name: Commit the pick
        env:
          COMMIT_MESSAGE_FILE: ${{ runner.temp }}/commit-message.txt
        run: |
          git config user.name "jiandewu"
          git config user.email "22378716+jiandewu@users.noreply.github.com"
          git add longread
          if git diff --cached --quiet; then
            echo "Nothing new."
            exit 0
          fi
          git commit --file "$COMMIT_MESSAGE_FILE"
          git pull --rebase origin main
          git push origin HEAD:main
