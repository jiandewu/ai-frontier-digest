name: Numbers

on:
  schedule:
    # UTC 01:29 picks up the evening arXiv listing and the closing market data; 13:29 picks up the
    # overnight US market digest and the morning FRED releases.
    - cron: "29 1,13 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Shared with the digests so they never push at the same time.
  group: update
  cancel-in-progress: false

jobs:
  numbers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Run unit tests
        run: python3 -m unittest discover -s tests

      - name: Update the numbers
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: python3 -m digest.numbers

      - name: Commit the numbers
        run: |
          git config user.name "jiandewu"
          git config user.email "22378716+jiandewu@users.noreply.github.com"
          git add numbers
          if git diff --cached --quiet; then
            echo "Nothing new."
            exit 0
          fi
          git commit -m "numbers: $(TZ=America/New_York date '+%F %H:%M') ET"
          git pull --rebase origin main
          git push origin HEAD:main
